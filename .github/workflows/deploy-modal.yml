name: Deploy backend su Modal

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-modal.yml"
  workflow_dispatch:

concurrency:
  group: deploy-modal
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MYSOGNI_FAKE_WORKER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installa Modal
        run: pip install "modal>=1.6,<2"
      - name: Pubblica
        run: modal deploy backend/modal_app.py
