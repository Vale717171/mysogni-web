name: Deploy backend su Modal

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-modal.yml"
  workflow_dispatch:

concurrency:
  group: deploy-modal
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MYSOGNI_API_TOKEN: ${{ secrets.MYSOGNI_API_TOKEN }}
      CHEAPERINFERENCE_API_KEY: ${{ secrets.CHEAPERINFERENCE_API_KEY }}
      MYSOGNI_LLM_MODEL: ${{ vars.MYSOGNI_LLM_MODEL }}
      # Interruttore della spesa GPU: variabile di repository, assente = spento.
      MYSOGNI_GPU_ENABLED: ${{ vars.MYSOGNI_GPU_ENABLED || '0' }}
      # UltraFast: secondo interruttore, da accendere solo dopo aver scaricato i pesi in mysogni-gpu.
      MYSOGNI_ULTRAFAST_ENABLED: ${{ vars.MYSOGNI_ULTRAFAST_ENABLED || '0' }}
      # Famiglia BF16 (UltraFast BF16 e Quality): solo dopo aver scaricato i pesi BF16 in mysogni-gpu.
      MYSOGNI_BF16_ENABLED: ${{ vars.MYSOGNI_BF16_ENABLED || '0' }}
      # Google Cloud: progetto e budget mensile dei crediti (stima del router); chiave nel secret GCP_ROUTER_KEY.
      MYSOGNI_GCP_PROJECT: ${{ vars.GCP_PROJECT }}
      MYSOGNI_GCP_REGION: ${{ vars.GCP_REGION }}
      MYSOGNI_GCP_BUDGET_USD: ${{ vars.GCP_BUDGET_USD }}
      # "1" = Automatico usa Google per primo; altrimenti Google solo se scelto esplicitamente nella pagina.
      MYSOGNI_GCP_AUTO: ${{ vars.GCP_AUTO }}
      # Saldo di partenza per il contatore dei crediti nella pagina: "<euro>@<AAAA-MM-GG>+<accredito mensile>".
      MYSOGNI_GCP_CREDITS: ${{ vars.GCP_CREDITS }}
      GCP_ROUTER_KEY: ${{ secrets.GCP_ROUTER_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installa Modal
        run: pip install "modal>=1.6,<2" python-dotenv
      - name: Aggiorna il token di accesso su Modal
        run: |
          if [ -z "$MYSOGNI_API_TOKEN" ]; then
            echo "::error::Manca il secret MYSOGNI_API_TOKEN nel repository"
            exit 1
          fi
          umask 077
          printf 'API_TOKEN=%s\n' "$MYSOGNI_API_TOKEN" > "$RUNNER_TEMP/auth.env"
          modal secret create mysogni-web-auth --from-dotenv "$RUNNER_TEMP/auth.env" --force > /dev/null
          rm -f "$RUNNER_TEMP/auth.env"
      - name: Aggiorna la chiave Google su Modal (segnaposto se manca)
        run: |
          umask 077
          if [ -n "$GCP_ROUTER_KEY" ]; then VALUE=$(printf '%s' "$GCP_ROUTER_KEY" | base64 -w0); else VALUE=unset; fi
          printf 'GCP_KEY_B64=%s\n' "$VALUE" > "$RUNNER_TEMP/gcp.env"
          modal secret create mysogni-web-gcp --from-dotenv "$RUNNER_TEMP/gcp.env" --force > /dev/null
          rm -f "$RUNNER_TEMP/gcp.env"
      - name: Aggiorna la chiave dello screenwriter su Modal
        run: |
          # Se il secret manca, lo screenwriter resta spento ma il resto si pubblica lo stesso.
          umask 077
          printf 'LLM_API_KEY=%s\n' "${CHEAPERINFERENCE_API_KEY:-unset}" > "$RUNNER_TEMP/llm.env"
          modal secret create mysogni-web-llm --from-dotenv "$RUNNER_TEMP/llm.env" --force > /dev/null
          rm -f "$RUNNER_TEMP/llm.env"
      - name: Pubblica
        run: modal deploy backend/modal_app.py
