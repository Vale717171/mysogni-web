<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>MySogni Web</title>
  <link rel="stylesheet" href="style.css?v=11">
</head>
<body>
  <main>
    <header>
      <h1>MySogni Web</h1>
      <button id="toggle-settings" type="button" class="link">Impostazioni</button>
    </header>

    <section id="settings" hidden>
      <h2>Impostazioni</h2>
      <p class="hint">Restano salvate solo in questo browser.</p>
      <label>Indirizzo del backend
        <input id="api-url" type="url" placeholder="https://valentinoricco--mysogni-web-api.us-east.modal.run" autocomplete="off">
      </label>
      <label>Token di accesso
        <input id="api-token" type="password" autocomplete="off">
      </label>
      <div class="row">
        <button id="save-settings" type="button">Salva</button>
        <button id="test-settings" type="button" class="secondary">Prova la connessione</button>
        <button id="copy-setup-link" type="button" class="secondary">Copia link di configurazione</button>
      </div>
      <p id="settings-status" class="status" role="status"></p>
      <label id="setup-link-field" hidden>Link di configurazione (contiene il token)
        <input id="setup-link" type="text" readonly>
      </label>
    </section>

    <section>
      <form id="job-form">
        <div id="screenwriter" hidden>
          <label>Idea in italiano
            <textarea id="idea" rows="3" maxlength="4000" placeholder="Es.: una giovane donna entra in un ristorante e si siede a un tavolo"></textarea>
          </label>
          <div class="row">
            <button id="write-prompt" type="button" class="secondary">Scrivi il prompt H3</button>
          </div>
          <p id="screenwriter-status" class="status" role="status"></p>
        </div>
        <label>Prompt
          <textarea id="prompt" rows="8" required placeholder="Descrivi la scena… (o fallo scrivere allo screenwriter qui sopra)"></textarea>
        </label>
        <div class="grid">
          <label>Durata
            <select id="duration">
              <option value="5">5 secondi</option>
              <option value="10">10 secondi</option>
              <option value="15">15 secondi</option>
            </select>
          </label>
          <label>Modello
            <select id="model">
              <option value="test">Video di prova (gratuito)</option>
            </select>
          </label>
          <label id="profile-field" hidden>Profilo
            <select id="profile"></select>
          </label>
          <label id="steps-field" hidden>Step
            <select id="steps"></select>
          </label>
          <label id="resolution-field" hidden>Risoluzione
            <select id="resolution"></select>
          </label>
          <label id="m3-field" hidden>LoRA M3
            <select id="m3"></select>
          </label>
          <label>Backend
            <select id="backend">
              <option value="auto">Automatico</option>
              <option value="modal">Modal</option>
              <option value="google" hidden>Google Cloud</option>
            </select>
          </label>
        </div>
        <p id="model-note" class="hint"></p>
        <p id="google-credits" class="hint" hidden></p>
        <button id="submit" type="submit">Genera</button>
      </form>
    </section>

    <section>
      <h2>Lavori</h2>
      <p id="empty" class="hint">Nessun lavoro in questa sessione.</p>
      <ol id="jobs"></ol>
    </section>
  </main>
  <script src="app.js?v=11"></script>
</body>
</html>
